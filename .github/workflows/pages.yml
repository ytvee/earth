name: Validate Earth Explorer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and geography
        run: |
          node --check dist/app.js
          node --check dist/vendor/three.core.js
          node --check dist/vendor/three.module.js
          python3 -m json.tool dist/assets/countries.json > /dev/null
